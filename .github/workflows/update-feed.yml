name: Update CCS Fall Sports RSS

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas lxml beautifulsoup4
      - run: python build_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "CCS RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "Update sports feed"
          git push
