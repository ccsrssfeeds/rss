name: Update Last 7 Days Football Scores RSS

on:
  push:
    branches: [main]
    paths:
      - 'manual_scores.csv'
      - 'google_sheet_url.txt'
      - 'build_football_scores_last7.py'
      - '.github/workflows/update-football-scores-last7.yml'
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_football_scores_last7.py
      - name: Add plain image URL fields and vMix XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          source = 'football_scores_last7.xml'
          tree = ET.parse(source)
          root = tree.getroot()

          for item in root.findall('./channel/item'):
              away = item.findtext('awayLogo') or ''
              home = item.findtext('homeLogo') or ''

              away_node = item.find('awayImageUrl')
              if away_node is None:
                  away_node = ET.Element('awayImageUrl')
                  item.insert(9, away_node)
              away_node.text = away

              home_node = item.find('homeImageUrl')
              if home_node is None:
                  home_node = ET.Element('homeImageUrl')
                  item.insert(10, home_node)
              home_node.text = home

          ET.indent(tree, space='  ')
          tree.write(source, encoding='utf-8', xml_declaration=True)

          vmix_root = ET.Element('Scores')
          for item in root.findall('./channel/item'):
              row = ET.SubElement(vmix_root, 'Score')
              ET.SubElement(row, 'AwayTeam').text = item.findtext('awayTeam') or ''
              ET.SubElement(row, 'AwayScore').text = item.findtext('awayScore') or ''
              ET.SubElement(row, 'HomeTeam').text = item.findtext('homeTeam') or ''
              ET.SubElement(row, 'HomeScore').text = item.findtext('homeScore') or ''
              ET.SubElement(row, 'AwayLogo').text = item.findtext('awayImageUrl') or item.findtext('awayLogo') or ''
              ET.SubElement(row, 'HomeLogo').text = item.findtext('homeImageUrl') or item.findtext('homeLogo') or ''
              ET.SubElement(row, 'Date').text = item.findtext('pubDate') or ''
              ET.SubElement(row, 'Final').text = 'FINAL'

          vmix_tree = ET.ElementTree(vmix_root)
          ET.indent(vmix_tree, space='  ')
          vmix_tree.write('football_scores_last7_vmix.xml', encoding='utf-8', xml_declaration=True)
          PY
      - name: Commit updated last-7-days football feeds
        run: |
          git config user.name "CCS RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_scores_last7.xml football_scores_last7_vmix.xml
          git diff --cached --quiet || git commit -m "Update last 7 days football score feeds"
          git push
