name: Update Last 7 Days Football Scores RSS

on:
  push:
    branches: [main]
    paths:
      - 'manual_scores.csv'
      - 'google_sheet_url.txt'
      - 'build_football_scores_last7.py'
      - '.github/workflows/update-football-scores-last7.yml'
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_football_scores_last7.py
      - name: Add plain image URL fields
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'football_scores_last7.xml'
          tree = ET.parse(path)
          root = tree.getroot()

          for item in root.findall('./channel/item'):
              away = item.findtext('awayLogo') or ''
              home = item.findtext('homeLogo') or ''

              away_node = item.find('awayImageUrl')
              if away_node is None:
                  away_node = ET.Element('awayImageUrl')
                  item.insert(5, away_node)
              away_node.text = away

              home_node = item.find('homeImageUrl')
              if home_node is None:
                  home_node = ET.Element('homeImageUrl')
                  item.insert(6, home_node)
              home_node.text = home

          ET.indent(tree, space='  ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
      - name: Commit updated last-7-days football feed
        run: |
          git config user.name "CCS RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_scores_last7.xml
          git diff --cached --quiet || git commit -m "Update last 7 days football scores feed"
          git push
