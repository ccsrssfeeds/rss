name: Update Football Scores RSS

on:
  push:
    branches: [main]
    paths:
      - 'manual_scores.csv'
      - 'google_sheet_url.txt'
      - 'build_football_scores.py'
      - '.github/workflows/update-football-scores.yml'
  schedule:
    # Refresh the published Google Sheet and rebuild the live-score RSS every 5 minutes.
    # Running every day also clears stale scores automatically when the date changes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_football_scores.py
      - name: Commit updated football feed
        run: |
          git config user.name "CCS RSS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add football_scores.xml
          git diff --cached --quiet || git commit -m "Update football scores feed"
          git push
