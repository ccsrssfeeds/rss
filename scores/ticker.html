<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regional Scores Ticker</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:#fff}#strip{position:absolute;top:0;left:0;width:100%;height:102px;display:flex;background:transparent}#head{background:rgba(4,21,40,.92);width:225px;flex:none;display:grid;place-items:center;font-size:24px;font-weight:900;text-align:center}#window{overflow:hidden;flex:1;background:rgba(4,21,40,.83)}#track{height:100%;display:flex;align-items:center;width:max-content;animation:scroll 80s linear infinite}#track:empty{animation:none}.item{display:flex;align-items:center;gap:14px;white-space:nowrap;border-right:2px solid #79bff2;padding:0 28px;font-size:27px;font-weight:bold}.item b{font-size:32px}.item em{font-size:17px;color:#aee0ff;font-style:normal}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}button{position:absolute;top:110px;right:10px;background:#071525;color:#fff;border:1px solid white;padding:7px;opacity:.1}button:hover{opacity:1}#msg{position:absolute;top:120px;color:red}</style></head><body><div id="strip"><div id="head">REGIONAL<br>SCORES</div><div id="window"><div id="track"></div></div></div><button onclick="configure()">Configure</button><div id="msg"></div><script>const sheet='10Dl3FqFX8KnPdlB1zdezo7r_-nu3ozHgCt8aJcHTxiU';const target='https://docs.google.com/spreadsheets/d/'+sheet+'/export?format=csv&gid=104889826';let feed=new URLSearchParams(location.search).get('csv')||localStorage.getItem('scores_feed')||target;
function parse(s){let a=[],r=[],t='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c=='"'){if(q&&s[i+1]=='"'){t+='"';i++}else q=!q}else if(c==','&&!q){r.push(t);t=''}else if(c=='\n'&&!q){r.push(t.replace(/\r$/,''));a.push(r);r=[];t=''}else t+=c}if(t||r.length){r.push(t);a.push(r)}let h=a.shift()||[];return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()]))).filter(x=>x.away_team&&x.home_team&&String(x.show).toLowerCase()!=='false').sort((x,y)=>Number(x.sort_order)-Number(y.sort_order))}async function load(){try{let r=await fetch(feed+(feed.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(parse(await r.text()))}catch(e){document.getElementById('msg').textContent='Scores feed unavailable. Publish/share the sheet for public viewing, or configure a published CSV URL.'}}function configure(){let u=prompt('Paste your Google Sheet published CSV URL:',feed);if(u){feed=u;localStorage.setItem('scores_feed',u);load()}}setInterval(load,30000);function draw(g){let t=document.getElementById('track');t.replaceChildren();document.getElementById('msg').textContent='';let frag=document.createDocumentFragment();for(let repetition=0;repetition<2;repetition++){g.forEach(x=>{let d=document.createElement('div');d.className='item';for(let v of [x.away_team,x.away_score||'—','at',x.home_team,x.home_score||'—']){let s=document.createElement(v==='at'?'em':'span');s.textContent=v;d.append(s)}let st=document.createElement('em');st.textContent=[x.status,x.quarter].filter(Boolean).join(' ');d.append(st);frag.append(d)})}t.append(frag)}load();</script></body></html>
