<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regional Football Scores</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;background:#091525;color:white}header{padding:20px;background:#132a46;display:flex;gap:20px;align-items:center;justify-content:space-between}h1{margin:0}button{background:#29aaff;color:#04101c;border:0;border-radius:7px;padding:10px;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;padding:20px}.game{background:#172e4d;padding:18px;border-radius:14px}.team{display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:700;margin:10px 0}.team b{font-size:32px}small{color:#aaccdd}#msg{padding:10px}</style></head><body><header><h1>REGIONAL FOOTBALL SCORES</h1><button onclick="configure()">Configure Sheet</button></header><p id="msg"></p><main id="grid"></main><script>const sheet='10Dl3FqFX8KnPdlB1zdezo7r_-nu3ozHgCt8aJcHTxiU';const target='https://docs.google.com/spreadsheets/d/e/2PACX-1vSewh1CcMf-iD5iTDMKlxFt43XJx7zvW0Buzl9zexLAOVBCCTdzwHARaDBExcsBvu8UrGW9m-S-VoN0/pub?gid=104889826&single=true&output=csv'+sheet+'/export?format=csv&gid=104889826';let feed=new URLSearchParams(location.search).get('csv')||localStorage.getItem('scores_feed')||target;
function parse(s){let a=[],r=[],t='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c=='"'){if(q&&s[i+1]=='"'){t+='"';i++}else q=!q}else if(c==','&&!q){r.push(t);t=''}else if(c=='\n'&&!q){r.push(t.replace(/\r$/,''));a.push(r);r=[];t=''}else t+=c}if(t||r.length){r.push(t);a.push(r)}let h=a.shift()||[];return a.map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()]))).filter(x=>x.away_team&&x.home_team&&String(x.show).toLowerCase()!=='false').sort((x,y)=>Number(x.sort_order)-Number(y.sort_order))}async function load(){try{let r=await fetch(feed+(feed.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(parse(await r.text()))}catch(e){document.getElementById('msg').textContent='Scores feed unavailable. Publish/share the sheet for public viewing, or configure a published CSV URL.'}}function configure(){let u=prompt('Paste your Google Sheet published CSV URL:',feed);if(u){feed=u;localStorage.setItem('scores_feed',u);load()}}setInterval(load,30000);function draw(g){let el=document.getElementById('grid');el.replaceChildren();document.getElementById('msg').textContent=g.length+' games · Updated '+new Date().toLocaleTimeString();g.forEach(x=>{let d=document.createElement('div');d.className='game';let top=document.createElement('small');top.textContent=[x.county,x.status,x.quarter,x.clock].filter(Boolean).join(' • ');d.append(top);for(let [team,score] of [[x.away_team,x.away_score],[x.home_team,x.home_score]]){let t=document.createElement('div');t.className='team';let n=document.createElement('span');n.textContent=team;let b=document.createElement('b');b.textContent=score||'—';t.append(n,b);d.append(t)}el.append(d)})}load();</script></body></html>
